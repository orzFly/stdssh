version: 2

project_name: stdssh

before:
  hooks:
    - go mod tidy

builds:
  - id: stdssh
    main: ./cmd/stdssh
    binary: stdssh
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    ids: [stdssh]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE

nfpms:
  - id: stdssh
    ids: [stdssh]
    package_name: stdssh
    vendor: stdssh
    homepage: https://github.com/orzFly/stdssh
    maintainer: stdssh maintainers <noreply@github.com>
    description: |-
      SSH server that speaks the SSH protocol over inherited stdin/stdout.
      Meant to be driven through kubectl exec (or any stdio pipe) so a stock
      ssh client gets exec, PTY shells, SFTP, port forwarding, and agent
      forwarding into a pod — no listening socket, no auth, no PAM.
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/stdssh/copyright
    file_name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"

release:
  draft: false
  prerelease: auto
